[nats]
url = "nats://localhost:4222"
stream = "TELEGRAM"

[publisher]
topic = "telegram.json"

[postgres]
url = "postgres://user:password@localhost:5432/aviation?sslmode=disable"
max_conns = 2
min_conns = 1

[app]
batch_size = 1
batch_timeout = "1s"
monitor_interval = "1s"

[log]
level = "info"
format = "json"

[telemetry]
enabled = false

[dlq]
enabled = false
subject = ""

[monitoring]
addr = ":0"
enable_metrics = false
enable_health = false
read_timeout = "0s"
write_timeout = "0s"
health_timeout = "0s"

