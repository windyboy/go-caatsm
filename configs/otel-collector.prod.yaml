receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: /etc/ssl/certs/otel-collector.crt
          key_file: /etc/ssl/private/otel-collector.key
        auth:
          authenticator: bearer_token
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /etc/ssl/certs/otel-collector.crt
          key_file: /etc/ssl/private/otel-collector.key
        auth:
          authenticator: bearer_token

processors:
  batch:
    send_batch_size: 1024
    timeout: 1s
    send_batch_max_size: 2048

  resource:
    attributes:
      - key: service.instance.id
        value: "${POD_NAME}"
        action: upsert
      - key: k8s.pod.name
        value: "${POD_NAME}"
        action: upsert
      - key: k8s.namespace.name
        value: "${NAMESPACE}"
        action: upsert

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: :1888
  zpages:
    endpoint: :55679
  bearer_token:
    token: ${OTEL_COLLECTOR_BEARER_TOKEN}

exporters:
  otlphttp/jaeger:
    endpoint: https://jaeger.production.company.com:4318
    headers:
      authorization: "Bearer ${JAEGER_API_TOKEN}"
    tls:
      insecure: false
      ca_file: /etc/ssl/certs/ca.pem
    sending_queue:
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  prometheusremotewrite:
    endpoint: https://prometheus-prod.company.com/api/v1/write
    headers:
      authorization: "Bearer ${PROMETHEUS_API_TOKEN}"
    tls:
      insecure: false
      ca_file: /etc/ssl/certs/ca.pem
    sending_queue:
      queue_size: 10000
    retry_on_failure:
      enabled: true

service:
  extensions: [health_check, pprof, zpages, bearer_token]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [prometheusremotewrite]