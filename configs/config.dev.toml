[nats]
url = "nats://localhost:4222"
client = "serial-client"
cluster = "tele-cluster"
stream = "TELEGRAM"
consumer = "telegram-consumer"

[nats.stream_limits]
max_msgs = 100000
max_bytes = 67108864
max_age = "24h"
discard = "old"
storage = "file"
replicas = 1

[nats.consumer_rules]
max_deliver = 5
ack_wait = "30s"
max_ack_pending = 1024
deliver_policy = "all"
replay_policy = "instant"
backoff = ["5s", "30s", "2m"]
start_sequence = 0
start_time = ""

[subscription]
topic = "telegram.serial"
queue_group = "tele-queue"

[publisher]
topic = "telegram.json"

[timeouts]
server = "5s"
reconnect_wait = "5s"
close = "10s"
ack_wait = "5s"

[postgres]
url = "postgres://user:password@localhost:5432/aviation?sslmode=disable"
max_conns = 10
min_conns = 2

[app]
batch_size = 50
batch_timeout = "2s"
monitor_interval = "30s"

[log]
level = "info"
format = "json"

[telemetry]
enabled = false
endpoint = "otel-collector:4318"
insecure = true