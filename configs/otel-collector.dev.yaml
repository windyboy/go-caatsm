receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  logging:
    loglevel: info
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      source: "otel-collector"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [logging, otlphttp/jaeger]
    metrics:
      receivers: [otlp]
      exporters: [logging, prometheus]

