receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 20971520  # 20MB
      grpc:
        endpoint: 0.0.0.0:4317
        max_concurrent_streams: 16

processors:
  batch:
    send_batch_size: 1024
    timeout: 1s
    send_batch_max_size: 2048

  resource:
    attributes:
      - key: service.instance.id
        value: "${POD_NAME}"
        action: upsert
      - key: k8s.pod.name
        value: "${POD_NAME}"
        action: upsert
      - key: k8s.namespace.name
        value: "${NAMESPACE}"
        action: upsert

exporters:
  logging:
    loglevel: info
    sampling_initial: 10
    sampling_thereafter: 100

  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    tls:
      insecure: true
    sending_queue:
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  prometheus:
    endpoint: "0.0.0.0:8889"
    const_labels:
      source: "otel-collector"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [logging, otlphttp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [logging, prometheus]

