global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets:
          - "otel-collector:8888"
  - job_name: "nats"
    metrics_path: /varz
    scheme: http
    static_configs:
      - targets:
          - "nats:8222"

