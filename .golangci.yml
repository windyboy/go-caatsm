version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - depguard
  settings:
    depguard:
      rules:
        telegram-pure-core:
          list-mode: strict
          files:
            - "**/internal/telegram/**/*.go"
            - "!$test"
          allow:
            - "$gostd"
            - "caatsm/internal/telegram"
        pipeline-no-infra:
          files:
            - "**/internal/pipeline/**/*.go"
          deny:
            - pkg: "caatsm/internal/config"
              desc: "internal/pipeline must accept Options instead of infra config"
            - pkg: "caatsm/internal/observability"
              desc: "internal/pipeline must define consumer-side Recorder interface"
            - pkg: "caatsm/internal/nats"
              desc: "internal/pipeline must depend only on internal/telegram and ports"
            - pkg: "caatsm/internal/postgres"
              desc: "internal/pipeline must depend only on internal/telegram and ports"
        nats-isolation:
          files:
            - "**/internal/nats/**/*.go"
          deny:
            - pkg: "caatsm/internal/pipeline"
              desc: "internal/nats must use consumer-side interfaces/behavioral errors without importing pipeline"
            - pkg: "caatsm/internal/observability"
              desc: "internal/nats must accept injected Recorder instead of importing observability"
        postgres-isolation:
          files:
            - "**/internal/postgres/**/*.go"
          deny:
            - pkg: "caatsm/internal/pipeline"
              desc: "internal/postgres must stay decoupled from pipeline"
            - pkg: "caatsm/internal/observability"
              desc: "internal/postgres must accept injected MetricsRecorder instead of importing observability"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
